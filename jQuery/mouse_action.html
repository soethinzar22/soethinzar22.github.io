<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .welcome{
            max-width: 250px;
            background-color: aqua;
            color: black;
            text-align: center;
            padding: 50px 0;

        }
    </style>
</head>
<body>
    <p id="heinLearn">Welcome to Hein Learn</p>

    <input type="text" name="" id="name">

    <script src="jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#heinLearn').mouseover(function(){
                $(this).addClass('welcome');
            })
            $('#heinLearn').mouseout(function(){
                $(this).removeClass('welcome');
            })
            $('#name').focus(function(){
                $(this).css({'background-color':'black'});
            })
        })
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="add_student">
        <h2 >Add Student</h2>
        Name: <input type="text" id="name"><br><br>
        Email: <input type="email" id="email"><br><br>
        Phone: <input type="number" id="phone"><br><br>
        Years: <select name="" id="year">
            <option value="">Choose Year</option>
            <option value="First">First Year</option>
            <option value="Second">Second Year</option>
            <option value="Third">Third Year</option>
        </select><br><br>
        <button id="add">Add Student</button>
    </div>

    <div id="update_student">
        <h2 >Update Student</h2>
        <input type="hidden" id="key">
        Name: <input type="text" id="edit_name"><br><br>
        Email: <input type="email" id="edit_email"><br><br>
        Phone: <input type="number" id="edit_phone"><br><br>
        Years: <select name="" id="edit_year">
            <option value="">Choose Year</option>
            <option value="First">First Year</option>
            <option value="Second">Second Year</option>
            <option value="Third">Third Year</option>
        </select><br><br>
        <button id="update">Update Student</button>
    </div>

    <h1>Student Lists</h1>
    <table border="1" cellspacing="0" cellpadding="25">
        <thead>
            <tr>
                <th>No</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Year</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>

    <script src="jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#update_student').hide();//အစမှာ update div တစ်ခုလုံးကို hide ထားမယ် 
            function getData(){
                let stuString = localStorage.getItem('students');
                let stuArray = JSON.parse(stuString);
                //i = key
                // v = valaue
                let data = '';
                let j = 1;
                $.each(stuArray, function(i,v){
                    console.log(v);
                    console.log(v.stu_name);
                    let name = v.stu_name ;
                    let email = v.stu_email;
                    let phone = v.stu_phone;
                    let year = v.stu_year;

                    data += `<tr>
                                <td>${j++}</td>
                                <td>${name}</td>
                                <td>${email}</td>
                                <td>${phone}</td>
                                <td>${year}</td>
                                <td>
                                    <button class="edit" data-key="${i}" data-name="${name}" data-email="${email}" data-phone="${phone}" data-year="${year}">Edit</button> 
                                    <button class="delete" data-key="${i}">Delete</button>
                                </td>
                            </tr>`;     //data- က data သယ်ဖို့ သုံး                       
                })
                $('tbody').html(data);
            }
            $('#add').click(function(){
                let name = $('#name').val(); // input လက်ခံမှာ 
                let email = $('#email').val();
                let phone = $('#phone').val();
                let year = $('#year').val();

                // console.log(name,email,phone,year);
                // //data အကုန်ဖြည့်ပြီးမှ ရှေ့ဆက်သွားလို့ရ validation
                // if(name && email && phone && year){
                //     //data တွေ ပေါ်စေ◌ချင်ရင် 
                // data += `<tr>
                //             <td>${i++}</td>
                //             <td>${name}</td>
                //             <td>${email}</td>
                //             <td>${phone}</td>
                //             <td>${year}</td>

                //         </tr>`;

                // console.log(data);

                // $('tbody').html(data); //table မှာပေါ်စေချင်ရင်
                
                // $('#name').val(''); //input box မှာ အရှေ့က data auto clear ဖြစ်
                // $('#email').val('');
                // $('#phone').val('');
                // $('#year').val('');
                // }else{
                //     alert('Input is required!');
                // }
                
                
                //data သိမ်းဖို့ object တည်ဆောက် 
                let students = {
                    stu_name: name,
                    stu_email: email,
                    stu_phone: phone,
                    stu_year: year
                }  
                console.log(students);

                //localstorage က string ပဲ သိမ်းလို့ရ လို့  local storage မဆောက်ရသေးပဲ get item အရင် ယူ 
                let studentString = localStorage.getItem('students');
                let studentArray; // var အလွတ် ကြေညာ
                if(studentString == null){ //input မှာ ရိုက်ထည့်လိုက်တဲ့ ဟာမရှိရငိ 
                    studentArray = []; //array တည်ဆောက်လိုက်မယ် 
                }else{
                    studentArray = JSON.parse(studentString); // input မှာ data ရိုက််ထည့်တာာ ရှိရငိ string ပြောင်းသွားမယ် 
                }
                //object array
                studentArray.push(students); //students ထဲက data တွေကို array ထဲ ထည့်မယ် 
                console.log(studentArray);
                //objec array ကို string ပြောင်း
                let studentData = JSON.stringify(studentArray);
                console.log(studentData);
                localStorage.setItem('students',studentData);
                
                
                getData();
                

            })
            
            $('tbody').on('click','.edit',function(){
                $('#add_student').hide();
                $('#update_student').show();

                let key = $(this).data('key');
                let name = $(this).data('name');
                let email = $(this).data('email');
                let phone = $(this).data('phone');
                let year = $(this).data('year');

                console.log(key,name,email,phone,year);
                $('#key').val(key);
                $('#edit_name').val(name);
                $('#edit_email').val(email);
                $('#edit_phone').val(phone);
                $('#edit_year').val(year);
                
            });

            $('#update').click(function(){
                let key = $('#key').val();
                let name = $('#edit_name').val();
                let email = $('#edit_email').val();
                let phone = $('#edit_phone').val();
                let year = $('#edit_year').val();

                console.log(key,name,email,phone,year);

                let studentString = localStorage.getItem('students');
                if(studentString) {
                    let studentArray = JSON.parse(studentString);

                    studentArray[key].stu_name = name ;
                    studentArray[key].stu_email = email ;
                    studentArray[key].stu_phone = phone ;
                    studentArray[key].stu_year = year ;

                    let studentData = JSON.stringify(studentArray);
                    localStorage.setItem('students',studentData);

                    getData();

                    $('#add_student').show();
                    $('#update_student').hide();

                }
                
            })
 
            $('tbody').on('click','.delete',function(){
                let key = $(this).data('key');
                console.log(key);

                let ans = confirm("Are you sure delete?");
                console.log(ans);
                if(ans){
                    let studentString = localStorage.getItem('students');
                    if(studentString){
                        let studentArray = JSON.parse(studentString);

                        studentArray.splice(key,1)//splice(start,number)

                        let studentData = JSON.stringify(studentArray);
                        localStorage.setItem('students',studentData);

                        getData();
                    }
                }
                
                
            })
 
        })
    </script>
</body>
</html>

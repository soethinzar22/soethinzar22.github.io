<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello jQuery</h1>
    <button id="click">Click</button>
    <script src="jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#click').click(function(){
                $('h1').hide(function(){
                    alert("Hide H1");
                })
            })
        })
    </script>
</body>
</html>

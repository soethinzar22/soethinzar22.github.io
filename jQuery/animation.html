<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #panel{
            max-width: 150px;
            padding: 50px;
            background-color: orange;
            position: relative;
            color: black;
            text-align: center;
            
        }
    </style>
</head>
<body>
    <p id="panel">Animation</p>
    <button id="start">Start</button>
    <script src="jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#start').click(function(){
                $('#panel').animate({left:'350px'},3000);
                $('#panel').animate({top:'350px'},3000);
                // $('#panel').animate({width:'100px'});
                // $('#panel').animate({height:'50px'});
                $('#panel').animate({left:'0px'},3000);
                $('#panel').animate({top:'0px'},3000);
                
                // $('#panel').animate({left:'-=350px'},3000);
                // $('#panel').animate({top:'-=350px'},3000);
                
            })
        })
    </script>
</body>
</html>
